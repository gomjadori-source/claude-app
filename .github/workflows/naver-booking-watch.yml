name: Naver Booking Watcher

on:
  schedule:
    # KST 09:00~23:50 → 10분마다 (UTC 00~14시)
    - cron: '*/10 0-14 * * *'
    # KST 00:00~08:00 → 1시간마다 (UTC 15~23시)
    - cron: '0 15-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: naver-booking-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: watcher/requirements.txt

      - name: Install dependencies
        run: pip install -r watcher/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('watcher/requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python watcher/main.py

      - name: Commit state
        run: |
          git config user.name "watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update watcher state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
