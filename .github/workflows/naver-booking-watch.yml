name: Naver Booking Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: naver-booking-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: naver-booking-watcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Check availability
        run: npm run check
        env:
          SMTP_USER: ${{ secrets.NAVER_WATCHER_SMTP_USER }}
          SMTP_PASS: ${{ secrets.NAVER_WATCHER_SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NAVER_WATCHER_NOTIFY_EMAIL }}

      - name: Commit updated state
        run: |
          git config user.name "naver-booking-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: 알림 상태 업데이트"
          git push
