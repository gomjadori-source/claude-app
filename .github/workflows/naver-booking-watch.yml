name: Naver Booking Watcher

on:
  schedule:
    # KST 08:00~24:00, 2시간마다 (총 9회/일). 네이버 봇 차단을 피하려 접근을
    # 최소화한 스케줄. UTC로 환산: KST 08→23(전날), 10→01, 12→03, 14→05,
    # 16→07, 18→09, 20→11, 22→13, 24→15
    - cron: '0 1,3,5,7,9,11,13,15,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: naver-booking-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: watcher/requirements.txt

      - name: Install dependencies
        run: pip install -r watcher/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('watcher/requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DEBUG_CAPTURE: "1"   # 진단용: 성공 응답 원본을 텔레그램으로 1회 전송 (이후 제거 예정)
        run: python watcher/main.py

      - name: Commit state
        run: |
          git config user.name "watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update watcher state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
